<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">

        <section class="weather-card">

            <div class="header">
                <div>
                    <span class="eyebrow">WEATHER DASHBOARD</span>
                    <h1>Check the weather.</h1>
                    <p>Real-time weather information for any city.</p>
                </div>
            </div>

            <div class="search-box">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Search city..."
                    autocomplete="off"
                >

                <button id="searchBtn">
                    <span>Search</span>
                    <span class="arrow">→</span>
                </button>
            </div>

            <div id="error"></div>

            <div id="weather"></div>

            <div class="footer">
                <span>Powered by Open-Meteo</span>
                <span class="status">
                    <span class="dot"></span>
                    Live Data
                </span>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
